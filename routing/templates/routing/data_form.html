<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if mode == 'add' %}新增資料{% else %}編輯資料{% endif %}</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <link rel="stylesheet" href="/static/responsive.css" />
    <style>
        :root {
            --primary: #4A90E2;
            --glass: rgba(255,255,255,0.95);
            --soft-shadow: 0 10px 30px rgba(0,0,0,0.08);
            --text-main: #344767;
            --sidebar-width: 80px;
            --sidebar-expanded: 260px;
            --bg: #f4f7fb;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            min-height: 100%;
            font-family: "Open Sans", "Microsoft JhengHei", Arial, sans-serif;
            background: var(--bg);
            color: #1f2937;
        }

        #soft-sidebar {
            position: fixed; top: 15px; left: 15px; bottom: 15px;
            width: var(--sidebar-width); z-index: 1200;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 15px; box-shadow: var(--soft-shadow);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #soft-sidebar:hover { width: var(--sidebar-expanded); }

        .sidebar-header {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 260px;
        }
        .sidebar-header .logo-box {
            background: var(--primary);
            color: white;
            padding: 8px;
            border-radius: 8px;
            display: flex;
        }
        .sidebar-header span {
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            opacity: 0;
            transition: 0.3s;
        }
        #soft-sidebar:hover .sidebar-header span { opacity: 1; }

        .menu-list {
            flex: 1;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 230px;
            text-decoration: none;
        }
        .menu-item:hover { background: #f8f9fa; }
        .menu-item .icon-box {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            color: #8392ab;
        }
        .menu-item.active .icon-box {
            background: var(--primary);
            color: white;
        }
        .menu-item span {
            font-size: 14px;
            font-weight: 600;
            color: #67748e;
            white-space: nowrap;
            opacity: 0;
            transition: 0.2s;
        }
        #soft-sidebar:hover .menu-item span { opacity: 1; }

        #top-nav {
            position: fixed;
            top: 15px;
            left: 110px;
            right: 15px;
            height: 60px;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: var(--soft-shadow);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body:has(#soft-sidebar:hover) #top-nav { left: 290px; }

        .nav-brand {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page {
            margin-left: 110px;
            padding: 95px 20px 20px;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body:has(#soft-sidebar:hover) .page { margin-left: 290px; }

        .card {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            max-width: 980px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .row.full { grid-column: 1 / -1; }

        label {
            font-weight: bold;
            color: #334155;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .check-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: #2563eb;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn.gray { background: #64748b; }
    </style>
</head>
<body>
    <aside id="soft-sidebar">
        <div class="sidebar-header">
            <div class="logo-box"><i data-lucide="layout-grid" size="18"></i></div>
            <span>Dispatch Nav</span>
        </div>
        <div class="menu-list">
            <a href="{% url 'home' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="home" size="18"></i></div>
                <span>主要地圖</span>
            </a>
            
            <a href="{% url 'live_monitor_page' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="map-pinned" size="18"></i></div>
                <span>即時監控</span>
            </a>

            <a href="{% url 'report_page' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="triangle-alert" size="18"></i></div>
                <span>問題回報</span>
            </a>

            <a href="{% url 'driver_admin_page' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="users-round" size="18"></i></div>
                <span>帳號管理</span>
            </a>

            <a href="{% url 'data_list' %}" class="menu-item active">
                <div class="icon-box"><i data-lucide="table" size="18"></i></div>
                <span>資料管理</span>
            </a>

            <a href="{% url 'cleaning_records_page' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="file-box" size="18"></i></div>
                 <span>清掃紀錄</span>
            </a>

            <a href="{% url 'login' %}" class="menu-item">
                <div class="icon-box"><i data-lucide="log-out" size="14"></i></div>
                <span>登出</span>
            </a>
        </div>
    </aside>

    <nav id="top-nav">
        <div class="nav-brand">
            <i data-lucide="square-pen"></i>
            {% if mode == 'add' %}新增點位資料{% else %}編輯點位資料{% endif %}
        </div>
    </nav>

    <div class="page">
        <div class="card">
            <h1>{% if mode == 'add' %}新增點位資料{% else %}編輯點位資料{% endif %}</h1>

            <form method="post">
                {% csrf_token %}

                <div class="grid">
                    <div class="row">
                        <label>所屬場站 depot</label>
                        <input type="text" name="depot" value="{{ row.depot|default:'' }}">
                    </div>

                    <div class="row">
                        <label>客戶名稱 client_name</label>
                        <input type="text" name="client_name" value="{{ row.client_name|default:'' }}">
                    </div>

                    <div class="row">
                        <label>服務時間 service_time</label>
                        <input type="number" step="0.1" name="service_time" value="{{ row.service_time|default:'' }}">
                    </div>

                    <div class="row">
                        <label>樓層 floor</label>
                        <input type="number" step="0.1" name="floor" value="{{ row.floor|default:'' }}">
                    </div>

                    <div class="row">
                        <label>排序代碼 order_id</label>
                        <input type="text" name="order_id" value="{{ row.order_id|default:'' }}">
                    </div>

                    <div class="row">
                        <label>緯度 lat</label>
                        <input type="number" step="0.000001" name="lat" value="{{ row.lat|default:'' }}">
                    </div>

                    <div class="row">
                        <label>經度 lon</label>
                        <input type="number" step="0.000001" name="lon" value="{{ row.lon|default:'' }}">
                    </div>

                    <div class="row full">
                        <label>地址 address</label>
                        <input type="text" name="address" value="{{ row.address|default:'' }}">
                    </div>
                </div>

                <div class="check-row">
                    <label><input type="checkbox" name="weekly_1" {% if row.weekly_1 %}checked{% endif %}> 週次 1</label>
                    <label><input type="checkbox" name="weekly_2" {% if row.weekly_2 %}checked{% endif %}> 週次 2</label>
                </div>

                <button class="btn" type="submit">儲存資料</button>
                <a class="btn gray" href="/data/">返回資料列表</a>
            </form>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
