<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{% if mode == 'add' %}新增資料{% else %}編輯資料{% endif %}</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }
        .page {
            padding: 24px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            max-width: 900px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .row.full {
            grid-column: 1 / -1;
        }
        label {
            font-weight: bold;
            color: #334155;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .check-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: #2563eb;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn.gray {
            background: #64748b;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>{% if mode == 'add' %}新增點位資料{% else %}編輯點位資料{% endif %}</h1>

            <form method="post">
                {% csrf_token %}

                <div class="grid">
                    <div class="row">
                        <label>所屬場站 depot</label>
                        <input type="text" name="depot" value="{{ row.depot|default:'' }}">
                    </div>

                    <div class="row">
                        <label>客戶名稱 client_name</label>
                        <input type="text" name="client_name" value="{{ row.client_name|default:'' }}">
                    </div>

                    <div class="row">
                        <label>服務時間 service_time</label>
                        <input type="number" step="0.1" name="service_time" value="{{ row.service_time|default:'' }}">
                    </div>

                    <div class="row">
                        <label>樓層 floor</label>
                        <input type="number" step="0.1" name="floor" value="{{ row.floor|default:'' }}">
                    </div>

                    <div class="row">
                        <label>排序代碼 order_id</label>
                        <input type="text" name="order_id" value="{{ row.order_id|default:'' }}">
                    </div>

                    <div class="row">
                        <label>緯度 lat</label>
                        <input type="number" step="0.000001" name="lat" value="{{ row.lat|default:'' }}">
                    </div>

                    <div class="row">
                        <label>經度 lon</label>
                        <input type="number" step="0.000001" name="lon" value="{{ row.lon|default:'' }}">
                    </div>

                    <div class="row full">
                        <label>地址 address</label>
                        <input type="text" name="address" value="{{ row.address|default:'' }}">
                    </div>
                </div>

                <div class="check-row">
                    <label><input type="checkbox" name="weekly_1" {% if row.weekly_1 %}checked{% endif %}> 週次 1</label>
                    <label><input type="checkbox" name="weekly_2" {% if row.weekly_2 %}checked{% endif %}> 週次 2</label>
                </div>

                <button class="btn" type="submit">儲存資料</button>
                <a class="btn gray" href="/data/">返回資料列表</a>
            </form>
        </div>
    </div>
</body>
</html>
