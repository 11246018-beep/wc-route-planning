<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Nav | 智慧派工系統 - 登入</title>
  {% load static %}
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #4A90E2;
      --text-main: #344767;
      --text-soft: #67748e;
      --soft-shadow: 0 20px 27px 0 rgba(0, 0, 0, 0.12);
      --card-bg: rgba(255, 255, 255, 0.88);
      --nav-bg: rgba(255, 255, 255, 0.82);
      --white-line: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Open Sans", sans-serif;
      background: linear-gradient(180deg, #e3f2fd 0%, #4A90E2 52%, #669ae2 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -90px;
      left: -120px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(8px);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      right: -120px;
      bottom: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(10px);
      z-index: 0;
      pointer-events: none;
    }

    #top-nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 1100px);
      height: 60px;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      border: 1px solid var(--white-line);
      box-shadow: 0 10px 30px rgba(29, 78, 137, 0.10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 24px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.2px;
    }

    .nav-brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .nav-brand-text {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-divider {
      color: #9aa7bd;
      font-weight: 600;
    }

    .nav-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: white;
      font-size: 13px;
      font-weight: 700;
      background: #344767;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 8px 18px rgba(52, 71, 103, 0.18);
    }

    .nav-action:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .content-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 110px 20px 40px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 28px;
      box-shadow: var(--soft-shadow);
      padding: 34px 38px 32px;
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-wrap img {
      width: 104px;
      height: 104px;
      object-fit: contain;
      display: block;
    }

    .card-header h2 {
      color: var(--text-main);
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .card-header p {
      color: var(--text-soft);
      font-size: 15px;
      margin: 0 0 30px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .form-group label {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 14px;
    }

    .input-wrapper i {
      color: #344767;
      flex-shrink: 0;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, color .2s ease;
    }

    .toggle-password:hover {
      background: #eef3ff;
      color: var(--primary);
    }

    .toggle-password i {
      color: currentColor;
    }

    input {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #d2d6da;
      border-radius: 14px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.96);
      outline: none;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(310deg, #21d4fd 0%, #2178dd 100%);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(33, 120, 221, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(33, 120, 221, 0.33);
    }

    .footer-link {
      font-size: 14px;
      color: var(--text-soft);
      margin-top: 22px;
    }

    .footer-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      #top-nav {
        width: calc(100% - 24px);
        padding: 0 12px 0 16px;
      }

      .nav-brand {
        gap: 10px;
      }

      .nav-brand-logo {
        width: 32px;
        height: 32px;
      }

      .nav-brand-text {
        gap: 6px;
        font-size: 15px;
      }

      .nav-brand-text .system-subtitle {
        display: none;
      }

      .nav-action {
        padding: 9px 14px;
        font-size: 12px;
      }

      .login-card {
        padding: 28px 22px 24px;
        border-radius: 24px;
      }

      .logo-wrap img {
        width: 88px;
        height: 88px;
      }

      .card-header h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <nav id="top-nav">
    <div class="nav-brand">
      <img src="{% static 'images/dispatch_nav_logo.png' %}" alt="Dispatch Nav Logo" class="nav-brand-logo">
      <div class="nav-brand-text">
        <span>Dispatch Nav</span>
        <span class="nav-divider">|</span>
        <span class="system-subtitle">智慧派工系統</span>
      </div>
    </div>

    <a href="{% url 'register' %}" class="nav-action">
      <i data-lucide="user-plus" size="16"></i>
      註冊
    </a>
  </nav>

  <div class="content-wrapper">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="{% static 'images/dispatch_nav_logo.png' %}" alt="Dispatch Nav Logo">
      </div>

      <div class="card-header">
        <h2>歡迎回來</h2>
        <p>請使用已審核的管理者帳號登入系統</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>管理員帳號 Manager ID</label>
          <div class="input-wrapper">
            <i data-lucide="user" size="20"></i>
            <input type="text" id="userid" placeholder="請輸入管理員帳號" required>
          </div>
        </div>

        <div class="form-group">
          <label>密碼 Password</label>
          <div class="input-wrapper password-wrapper">
            <i data-lucide="lock" size="20"></i>
            <input type="password" id="password" placeholder="請輸入密碼" required>
            <button type="button" class="toggle-password" data-target="password" aria-label="顯示密碼">
              <i data-lucide="eye" size="20"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">登入系統</button>
      </form>

      <div class="footer-link">
        還沒有帳號？ <a href="{% url 'register' %}">申請管理者帳號</a>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    document.querySelectorAll('.toggle-password').forEach((button) => {
      const input = document.getElementById(button.dataset.target);
      if (!input) return;
      const show = () => {
        input.type = 'text';
        button.innerHTML = '<i data-lucide="eye-off" size="20"></i>';
        lucide.createIcons();
      };
      const hide = () => {
        input.type = 'password';
        button.innerHTML = '<i data-lucide="eye" size="20"></i>';
        lucide.createIcons();
      };
      button.addEventListener('mousedown', show);
      button.addEventListener('mouseup', hide);
      button.addEventListener('mouseleave', hide);
      button.addEventListener('touchstart', (e) => { e.preventDefault(); show(); }, { passive: false });
      button.addEventListener('touchend', hide);
      button.addEventListener('click', (e) => e.preventDefault());
    });

    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();

      const userid = document.getElementById('userid').value;
      const password = document.getElementById('password').value;

      const response = await fetch("{% url 'login' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({ userid: userid, password: password })
      });

      const result = await response.json();

      if (result.success) {
        window.location.href = "{% url 'home' %}";
      } else {
        alert(result.message);
      }
    };
  </script>
</body>
</html>
