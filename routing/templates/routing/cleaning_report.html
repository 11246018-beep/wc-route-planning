<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispatch Nav | 清掃分析報表</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #4A90E2;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray: #6b7280;
      --glass: rgba(255, 255, 255, 0.95);
      --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --text-main: #344767;
      --sidebar-width: 80px;
      --sidebar-expanded: 260px;
      --bg: #f8f9fa;
      --line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body, html {
      height: 100%;
      margin: 0;
      font-family: "Open Sans", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    #soft-sidebar {
      position: fixed;
      top: 15px;
      left: 15px;
      bottom: 15px;
      width: var(--sidebar-width);
      z-index: 1200;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      box-shadow: var(--soft-shadow);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #soft-sidebar:hover { width: var(--sidebar-expanded); }

    .sidebar-header {
      padding: 25px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 260px;
    }

    .sidebar-header .logo-box {
      background: var(--primary);
      color: white;
      padding: 8px;
      border-radius: 8px;
      display: flex;
    }

    .sidebar-header span {
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      opacity: 0;
      transition: 0.3s;
    }

    #soft-sidebar:hover .sidebar-header span { opacity: 1; }

    .menu-list {
      flex: 1;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 230px;
      text-decoration: none;
    }

    .menu-item:hover { background: #f8f9fa; }

    .menu-item .icon-box {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      color: #8392ab;
    }

    .menu-item.active .icon-box {
      background: var(--primary);
      color: white;
    }

    .menu-item span {
      font-size: 14px;
      font-weight: 600;
      color: #67748e;
      white-space: nowrap;
      opacity: 0;
      transition: 0.2s;
    }

    #soft-sidebar:hover .menu-item span { opacity: 1; }

    #top-nav {
      position: fixed;
      top: 15px;
      left: 110px;
      right: 15px;
      height: 60px;
      z-index: 1000;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: var(--soft-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body:has(#soft-sidebar:hover) #top-nav { left: 290px; }

    .nav-brand {
      font-weight: 700;
      font-size: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #67748e;
      font-weight: 600;
    }

    .page-wrap {
      margin-left: 110px;
      padding: 95px 20px 24px;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body:has(#soft-sidebar:hover) .page-wrap { margin-left: 290px; }

    .summary-grid,
    .chart-grid,
    .table-wrap {
      max-width: 1500px;
      margin: 0 auto 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .summary-card,
    .panel,
    .table-wrap {
      background: var(--glass);
      border-radius: 16px;
      box-shadow: var(--soft-shadow);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .summary-card { padding: 18px; }

    .summary-label {
      font-size: 12px;
      font-weight: 700;
      color: #8392ab;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .panel-note {
      font-size: 13px;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .chart-wrap {
      position: relative;
      min-height: 320px;
      background: white;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e5e7eb;
    }

    .table-wrap {
      overflow: hidden;
    }

    .table-header {
      padding: 18px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .table-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .small-text {
      font-size: 12px;
      line-height: 1.6;
      color: #64748b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: white;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eef3ff;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
    }

    .status-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .empty-box {
      padding: 30px;
      text-align: center;
      color: #8392ab;
    }

    .btn {
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      background: var(--gray);
    }

    @media (max-width: 1200px) {
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
      .page-wrap {
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <aside id="soft-sidebar">
    <div class="sidebar-header">
      <div class="logo-box"><i data-lucide="layout-grid" size="18"></i></div>
      <span>Dispatch Nav</span>
    </div>
    <div class="menu-list">
      <a href="{% url 'home' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="home" size="18"></i></div>
        <span>主要地圖</span>
      </a>

      <a href="{% url 'live_monitor_page' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="map-pinned" size="18"></i></div>
        <span>即時監控</span>
      </a>

      <a href="{% url 'report_page' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="triangle-alert" size="18"></i></div>
        <span>問題回報</span>
      </a>

      <a href="{% url 'driver_admin_page' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="users-round" size="18"></i></div>
        <span>帳號管理</span>
      </a>

      <a href="{% url 'data_list' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="table" size="18"></i></div>
        <span>資料管理</span>
      </a>

      <a href="{% url 'cleaning_records_page' %}" class="menu-item active">
        <div class="icon-box"><i data-lucide="file-box" size="18"></i></div>
        <span>清掃紀錄</span>
      </a>

      <a href="{% url 'login' %}" class="menu-item">
        <div class="icon-box"><i data-lucide="log-out" size="14"></i></div>
        <span>登出</span>
      </a>
    </div>
  </aside>

  <nav id="top-nav">
    <div class="nav-brand"><i data-lucide="bar-chart-3"></i> 清掃分析報表</div>
    <div class="nav-right">
      <button class="btn" type="button" onclick="window.location.href='/cleaning-records/'">
        <i data-lucide="arrow-left"></i> 返回清掃紀錄
      </button>
      <span id="lastUpdateText">最後更新：--</span>
    </div>
  </nav>

  <main class="page-wrap">
    <section class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">清掃總流程數</div>
        <div class="summary-value" id="summaryFlowCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">清掃完成率</div>
        <div class="summary-value" id="summaryCompleteRate">0%</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">需重清次數</div>
        <div class="summary-value" id="summaryRecleanCount">0</div>
      </div>
    </section>

    <section class="chart-grid">
      <div class="panel">
        <h3>清掃結果統計</h3>
        <div class="panel-note">
          統計清潔結果的合格與不合格比例，用來觀察整體清掃完成品質。
        </div>
        <div class="chart-wrap">
          <canvas id="flowChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h3>司機清掃完成品質</h3>
        <div class="panel-note">
          統計各司機清潔後照片的合格率，用來觀察清掃完成品質。
        </div>
        <div class="chart-wrap">
          <canvas id="driverChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h3>每日使用量偏高趨勢</h3>
        <div class="panel-note">
          統計每天清潔前被判定為使用量偏高的次數，用來觀察需求變化。
        </div>
        <div class="chart-wrap">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h3>縣市需求分布</h3>
        <div class="panel-note">
          統計各縣市清潔前使用量偏高次數，用來觀察不同區域的流動廁所需求分布情況
        </div>
        <div class="chart-wrap">
          <canvas id="pointChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    let flowChartInstance = null;
    let driverChartInstance = null;
    let trendChartInstance = null;
    let pointChartInstance = null;

    function updateLastUpdateTime() {
      const now = new Date();
      const text = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('lastUpdateText').textContent = `最後更新：${text}`;
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function getRecordTime(record) {
      return record.created_at || record.uploaded_at || record.time || '-';
    }

    function getRecordAddress(record) {
      return record.stop_address || record.address || record.point_key || '-';
    }

    function getRecordStatus(record) {
      return record.status || record.review_status || (record.is_qualified === true ? '合格' : record.is_qualified === false ? '不合格' : '-');
    }

    function normalizeRecord(raw) {
      return {
        driver_code: raw.driver_code ?? '-',
        created_at: getRecordTime(raw),
        stop_address: getRecordAddress(raw),
        photo_type: raw.photo_type ?? '',
        status: getRecordStatus(raw),
        is_qualified: raw.is_qualified,
        is_risk: raw.is_risk === true || raw.status === '高風險' || raw.review_status === '高風險'
      };
    }

    function isBefore(record) {
      return record.photo_type === 'before' || record.photo_type === '前';
    }

    function isAfter(record) {
      return record.photo_type === 'after' || record.photo_type === '後';
    }

    function isUnqualified(record) {
      return (
        record &&
        (
          record.status === '不合格' ||
          record.is_qualified === false ||
          record.is_risk === true
        )
      );
    }

    function isQualified(record) {
      return (
        record &&
        (
          record.status === '合格' ||
          record.is_qualified === true
        )
      );
    }

    function buildFlows(records) {
      const grouped = {};

      records.forEach(record => {
        const dateOnly = String(record.created_at || '').split('T')[0].split(' ')[0];
        const key = `${record.driver_code}__${record.stop_address}__${dateOnly}`;

        if (!grouped[key]) {
          grouped[key] = {
            driver_code: record.driver_code || '-',
            date: dateOnly || '-',
            stop_address: record.stop_address || '-',
            before: null,
            after: null
          };
        }

        if (isBefore(record)) {
          grouped[key].before = record;
        }

        if (isAfter(record)) {
          grouped[key].after = record;
        }
      });

      return Object.values(grouped);
    }

    function renderSummary(flows, expansionItems) {
      const totalFlows = flows.length;
      const completedFlows = flows.filter(f => f.after).length;
      const recleanCount = flows.filter(f => f.after && isUnqualified(f.after)).length;
      const completeRate = totalFlows ? ((completedFlows / totalFlows) * 100).toFixed(1) : '0.0';

      document.getElementById('summaryFlowCount').textContent = totalFlows;
      document.getElementById('summaryCompleteRate').textContent = `${completeRate}%`;
      document.getElementById('summaryRecleanCount').textContent = recleanCount;

    }

    function renderFlowChart(flows) {
      const passCount = flows.filter(f => f.after && isQualified(f.after)).length;
      const failCount = flows.filter(f => f.after && isUnqualified(f.after)).length;

      if (flowChartInstance) flowChartInstance.destroy();

      flowChartInstance = new Chart(document.getElementById('flowChart'), {
        type: 'doughnut',
        data: {
          labels: ['合格', '不合格'],
          datasets: [{
            data: [passCount, failCount]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    function renderDriverChart(flows) {
      const map = {};

      flows.forEach(flow => {
        const driver = flow.driver_code || '-';
        if (!map[driver]) {
          map[driver] = { totalAfter: 0, qualifiedAfter: 0 };
        }

        if (flow.after) {
          map[driver].totalAfter += 1;
          if (isQualified(flow.after)) {
            map[driver].qualifiedAfter += 1;
          }
        }
      });

      const rows = Object.entries(map)
        .map(([driver, item]) => {

          const fail = item.totalAfter - item.qualifiedAfter;

          return {
            driver,
            pass: item.qualifiedAfter,
            fail,
            total: item.totalAfter,
            rate: item.totalAfter
              ? Number(((item.qualifiedAfter / item.totalAfter) * 100).toFixed(1))
              : 0
          };
        })
        .filter(item => item.total > 0)
        .sort((a, b) => b.total - a.total);

      if (driverChartInstance) driverChartInstance.destroy();

      driverChartInstance = new Chart(document.getElementById('driverChart'), {
        type: 'bar',
        data: {
          labels: rows.map(r => r.driver),
          datasets: [
            {
              label: '合格筆數',
              data: rows.map(r => r.pass),
              borderWidth: 1
            },
            {
              label: '不合格筆數',
              data: rows.map(r => r.fail),
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            },
            tooltip: {
              callbacks: {
                afterBody: function(items) {
                  const index = items[0].dataIndex;
                  const row = rows[index];
                  return `合格率：${row.rate}%`;
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true
            },
            y: {
              stacked: true,
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
    }

    function renderTrendChart(records) {
      const map = {};

      records
        .filter(r => isBefore(r) && isUnqualified(r))
        .forEach(record => {
          const dateOnly = String(record.created_at || '').split('T')[0].split(' ')[0] || '-';
          map[dateOnly] = (map[dateOnly] || 0) + 1;
        });

      const labels = Object.keys(map).sort();
      const values = labels.map(label => map[label]);

      if (trendChartInstance) trendChartInstance.destroy();
      trendChartInstance = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '使用量偏高次數',
            data: values,
            tension: 0.3,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } }
          }
        }
      });
    }

    function renderPointChart(records) {

      const cityMap = {};

      records
        .filter(r => isBefore(r) && isUnqualified(r))
        .forEach(record => {

          const address = record.stop_address || '-';

          // 抓縣市
          let city = '其他';

          if (address.includes('台北市')) city = '台北市';
          else if (address.includes('新北市')) city = '新北市';
          else if (address.includes('桃園市')) city = '桃園市';
          else if (address.includes('台中市')) city = '台中市';
          else if (address.includes('台南市')) city = '台南市';
          else if (address.includes('高雄市')) city = '高雄市';
          else if (address.includes('苗栗縣')) city = '苗栗縣';
          else if (address.includes('新竹市')) city = '新竹市';
          else if (address.includes('新竹縣')) city = '新竹縣';

          cityMap[city] = (cityMap[city] || 0) + 1;
        });

      const rows = Object.entries(cityMap)
        .map(([city, count]) => ({ city, count }))
        .filter(item => item.city !== '其他')
        .sort((a, b) => b.count - a.count);

      if (pointChartInstance) pointChartInstance.destroy();

      pointChartInstance = new Chart(document.getElementById('pointChart'), {
        type: 'bar',
        data: {
          labels: rows.map(r => r.city),
          datasets: [{
            label: '使用量偏高次數',
            data: rows.map(r => r.count),
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
    }
    
          
      
    async function loadReport() {
      try {
        const [recordRes, expansionRes] = await Promise.all([
          fetch('/api/admin/cleaning-records/'),
          fetch('/api/toilet-demand-analysis/')
        ]);

        const recordData = await recordRes.json();
        const expansionData = await expansionRes.json();

        if (!recordRes.ok || !recordData.ok) {
          alert('清掃紀錄讀取失敗');
          return;
        }

        const records = Array.isArray(recordData.records)
          ? recordData.records.map(normalizeRecord)
          : [];

        const expansionItems = expansionData.ok && Array.isArray(expansionData.records)
          ? expansionData.records
          : [];

        const flows = buildFlows(records);

        renderSummary(flows, expansionItems);
        renderFlowChart(flows);
        renderDriverChart(flows);
        renderTrendChart(records);
        renderPointChart(records);
        updateLastUpdateTime();
      } catch (err) {
        alert(`連線失敗：${err}`);
      }
    }

    loadReport();
  </script>
</body>
</html>
