<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispatch Nav | 智慧導航系統</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #4A90E2;
      --glass: rgba(255, 255, 255, 0.95);
      --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --text-main: #344767;
      --sidebar-width: 80px;
      --sidebar-expanded: 260px;
    }
    body, html { height: 100%; margin: 0; font-family: "Open Sans", sans-serif; background: #f8f9fa; overflow: hidden; }

    #soft-sidebar {
      position: fixed; top: 15px; left: 15px; bottom: 15px;
      width: var(--sidebar-width); z-index: 1200;
      background: var(--glass); backdrop-filter: blur(10px);
      border-radius: 15px; box-shadow: var(--soft-shadow);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden; display: flex; flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #soft-sidebar:hover { width: var(--sidebar-expanded); }

    .sidebar-header { padding: 25px 20px; display: flex; align-items: center; gap: 15px; min-width: 260px; }
    .sidebar-header .logo-box { background: var(--primary); color: white; padding: 8px; border-radius: 8px; display: flex; }
    .sidebar-header span { font-weight: 700; color: var(--text-main); white-space: nowrap; opacity: 0; transition: 0.3s; }
    #soft-sidebar:hover .sidebar-header span { opacity: 1; }

    .menu-list { flex: 1; padding: 10px 15px; display: flex; flex-direction: column; gap: 5px; }
    .menu-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 10px; cursor: pointer; transition: background 0.2s; min-width: 230px; text-decoration: none; }
    .menu-item:hover { background: #f8f9fa; }
    .menu-item .icon-box { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #8392ab; }
    .menu-item.active .icon-box { background: var(--primary); color: white; }
    .menu-item span { font-size: 14px; font-weight: 600; color: #67748e; white-space: nowrap; opacity: 0; transition: 0.2s; }
    #soft-sidebar:hover .menu-item span { opacity: 1; }

    #top-nav {
      position: fixed; top: 15px;
      left: 110px;
      right: 15px; height: 60px;
      z-index: 1000; background: var(--glass); backdrop-filter: blur(10px);
      border-radius: 12px; box-shadow: var(--soft-shadow); display: flex;
      align-items: center; padding: 0 20px; border: 1px solid rgba(255, 255, 255, 0.3);
      justify-content: space-between;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body:has(#soft-sidebar:hover) #top-nav {
      left: 290px;
    }

    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-brand { font-weight: 700; font-size: 18px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    select { border-radius: 10px; border: 1px solid #d2d6da; padding: 8px 12px; font-size: 14px; background: #fff; outline: none; }

    .day-switcher { display: flex; align-items: center; background: #fff; border: 1px solid #d2d6da; border-radius: 10px; overflow: hidden; }
    .day-display { padding: 0 15px; font-size: 14px; font-weight: 600; color: var(--primary); border-left: 1px solid #eee; border-right: 1px solid #eee; display: flex; align-items: center; gap: 8px; min-width: 90px; justify-content: center; }
    .nav-btn { border: none; background: transparent; padding: 8px; cursor: pointer; color: var(--primary); display: flex; }
    .today-badge { background: #e1f0ff; color: #0056b3; font-size: 11px; padding: 2px 8px; border-radius: 20px; }

    .variant-group { background: #f0f2f5; border-radius: 10px; padding: 3px; display: flex; }
    .variant-btn { border: none; padding: 6px 15px; cursor: pointer; font-weight: 600; background: transparent; color: #8392ab; font-size: 13px; }
    .variant-btn.active { background: #fff; color: var(--primary); border-radius: 7px; }
    .status-container { display: flex; align-items: center; gap: 15px; font-size: 13px; font-weight: 600; }

    #map { height: 100vh; width: 100vw; z-index: 1; }
    #kpi-panel { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: var(--glass); padding: 12px 20px; border-radius: 12px; box-shadow: var(--soft-shadow); display: flex; gap: 20px; }
    .kpi-item { text-align: center; }
    .kpi-label { font-size: 10px; color: #8392ab; text-transform: uppercase; font-weight: 700; }
    .kpi-value { font-size: 18px; color: var(--text-main); font-weight: 700; }
  </style>
</head>
<body>

<aside id="soft-sidebar">
  <div class="sidebar-header">
    <div class="logo-box"><i data-lucide="layout-grid" size="18"></i></div>
    <span>Dispatch Nav</span>
  </div>
  <div class="menu-list">
    <a href="{% url 'home' %}" class="menu-item active">
      <div class="icon-box"><i data-lucide="home" size="18"></i></div>
      <span>Dashboard</span>
    </a>

    <a href="{% url 'report_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="triangle-alert" size="18"></i></div>
      <span>問題回報</span>
    </a>

    <a href="{% url 'driver_admin_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="users-round" size="18"></i></div>
      <span>帳號管理</span>
    </a>

    <a href="{% url 'data_list' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="table" size="18"></i></div>
      <span>資料管理</span>
    </a>

    <a href="{% url 'login' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="log-out" size="14"></i></div>
      <span>登出</span>
    </a>
  </div>
</aside>

<nav id="top-nav">
  <div class="nav-left">
    <div class="nav-brand"><i data-lucide="truck"></i> Dispatch</div>
    <div class="controls">
      <select id="driverSel"><option>載入中...</option></select>
      <div class="day-switcher">
        <button type="button" class="nav-btn" id="prevDay"><i data-lucide="chevron-left"></i></button>
        <div class="day-display"><span id="currentDayText">第 1 天</span><span class="today-badge">今天</span></div>
        <button type="button" class="nav-btn" id="nextDay"><i data-lucide="chevron-right"></i></button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="variant-group">
      <button type="button" class="variant-btn" data-variant="normal">不跨縣市</button>
      <button type="button" class="variant-btn" data-variant="compact">可跨縣市</button>
    </div>
    <div class="status-container">
      <div style="color:#17ad37">● 系統正常</div>
      <div id="liveTime">00:00:00</div>
    </div>
  </div>
</nav>

<div id="map"></div>

<div id="kpi-panel">
  <div class="kpi-item"><div class="kpi-label">點位數</div><div id="kpiStops" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">總工時(min)</div><div id="kpiTotal" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">距離(km)</div><div id="kpiDist" class="kpi-value">-</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const INITIAL_VARIANT = "{{ initial_variant|escapejs }}";
const VARIANT_COLORS = { normal: "#4A90E2", compact: "#ef4444" };
let map, routeLayer, stopLayer, depotLayer;
let state = { variant: INITIAL_VARIANT, options: null, route: null };
let currentDayIndex = 0;

function startLiveTime() {
  const timeEl = document.getElementById('liveTime');
  function update() {
    const now = new Date();
    const ampm = now.getHours() >= 12 ? '下午' : '上午';
    timeEl.textContent = `${ampm}${now.getHours()%12 || 12}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  }
  setInterval(update, 1000);
  update();
}

function initMap() {
  map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([25.02, 121.2], 10);
  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
  stopLayer = L.layerGroup().addTo(map);
  depotLayer = L.layerGroup().addTo(map);
}

async function fetchJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}

function populateSelect(selectEl, items, selectedValue="") {
  selectEl.innerHTML = "";
  items.forEach(item => {
    const opt = document.createElement("option");
    opt.value = String(item.value);
    opt.textContent = item.label;
    if (String(item.value) === String(selectedValue)) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

function updateDayUI() {
  const driver = document.getElementById("driverSel").value;
  const days = state.options?.days_by_driver?.[driver] || [];
  if (days.length > 0) {
    document.getElementById("currentDayText").textContent = `第 ${days[currentDayIndex]} 天`;
    renderRoute();
  }
}

async function loadVariant(variant) {
  state.variant = variant;
  currentDayIndex = 0;
  document.querySelectorAll(".variant-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.variant === variant));
  try {
    const data = await fetchJSON(`/api/routes/options/?variant=${variant}`);
    state.options = data;
    populateSelect(document.getElementById("driverSel"), data.drivers || []);
    updateDayUI();
  } catch (err) {
    console.error(err);
  }
}

async function renderRoute() {
  const driver = document.getElementById("driverSel").value;
  const days = state.options?.days_by_driver?.[driver] || [];
  const day = days[currentDayIndex];
  if (!driver || !day || !state.variant) return;

  try {
    const data = await fetchJSON(`/api/routes/detail/?variant=${state.variant}&driver=${encodeURIComponent(driver)}&day=${day}`);
    state.route = data.route;
    routeLayer.clearLayers();
    stopLayer.clearLayers();
    depotLayer.clearLayers();
    const color = VARIANT_COLORS[state.variant] || "#4A90E2";
    const coords = [];

    if (state.route.depot) {
      const d = [parseFloat(state.route.depot.lat), parseFloat(state.route.depot.lon)];
      coords.push(d);
      L.circleMarker(d, { radius: 9, color: "#344767", weight: 3, fillColor: "#fff", fillOpacity: 1 }).addTo(depotLayer);
    }

    state.route.stops.forEach(s => {
      const p = [parseFloat(s.lat), parseFloat(s.lon)];
      coords.push(p);
      L.circleMarker(p, { radius: 6, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
        .addTo(stopLayer)
        .bindPopup(`<b>${s.task_id}</b><br>${s.address}`);
    });

    const coordStr = coords.map(([lat, lon]) => `${lon},${lat}`).join(";");
    const osrmRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`);
    const osrmData = await osrmRes.json();

    if (osrmData.routes && osrmData.routes[0]) {
      const latlngs = osrmData.routes[0].geometry.coordinates.map(([lon, lat]) => [lat, lon]);
      L.polyline(latlngs, { color: "#ffffff", weight: 10, opacity: 0.9, lineCap: 'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color: color, weight: 5, opacity: 1.0, lineCap: 'round' }).addTo(routeLayer);
      document.getElementById("kpiDist").textContent = (osrmData.routes[0].distance / 1000).toFixed(1);
      document.getElementById("kpiTotal").textContent = Math.round(osrmData.routes[0].duration / 60 + (state.route.metrics?.service_min || 0));
      document.getElementById("kpiStops").textContent = state.route.stops.length;
      map.fitBounds(L.polyline(latlngs).getBounds().pad(0.2));
    }
  } catch (err) {
    console.error(err);
  }
}

function bindEvents() {
  document.getElementById("driverSel").addEventListener("change", () => {
    currentDayIndex = 0;
    updateDayUI();
  });

  document.getElementById("prevDay").addEventListener("click", () => {
    if (currentDayIndex > 0) {
      currentDayIndex--;
      updateDayUI();
    }
  });

  document.getElementById("nextDay").addEventListener("click", () => {
    const driver = document.getElementById("driverSel").value;
    const days = state.options?.days_by_driver?.[driver] || [];
    if (currentDayIndex < days.length - 1) {
      currentDayIndex++;
      updateDayUI();
    }
  });

  document.querySelectorAll(".variant-btn").forEach(btn =>
    btn.addEventListener("click", () => loadVariant(btn.dataset.variant))
  );
}

initMap();
bindEvents();
startLiveTime();
lucide.createIcons();
loadVariant(INITIAL_VARIANT);
</script>
</body>
</html>
