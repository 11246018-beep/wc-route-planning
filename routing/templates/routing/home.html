<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispatch Nav | 智慧導航系統</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #4A90E2;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --glass: rgba(255, 255, 255, 0.95);
      --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --text-main: #344767;
      --sidebar-width: 80px;
      --sidebar-expanded: 260px;
    }

    body, html {
      height: 100%;
      margin: 0;
      font-family: "Open Sans", sans-serif;
      background: #f8f9fa;
      overflow: hidden;
    }

    #soft-sidebar {
      position: fixed;
      top: 15px;
      left: 15px;
      bottom: 15px;
      width: var(--sidebar-width);
      z-index: 1200;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      box-shadow: var(--soft-shadow);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #soft-sidebar:hover { width: var(--sidebar-expanded); }

    .sidebar-header {
      padding: 25px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 260px;
    }
    .sidebar-header .logo-box {
      background: var(--primary);
      color: white;
      padding: 8px;
      border-radius: 8px;
      display: flex;
    }
    .sidebar-header span {
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      opacity: 0;
      transition: 0.3s;
    }
    #soft-sidebar:hover .sidebar-header span { opacity: 1; }

    .menu-list {
      flex: 1;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 230px;
      text-decoration: none;
    }
    .menu-item:hover { background: #f8f9fa; }

    .menu-item .icon-box {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      color: #8392ab;
    }
    .menu-item.active .icon-box {
      background: var(--primary);
      color: white;
    }
    .menu-item span {
      font-size: 14px;
      font-weight: 600;
      color: #67748e;
      white-space: nowrap;
      opacity: 0;
      transition: 0.2s;
    }
    #soft-sidebar:hover .menu-item span { opacity: 1; }

    #top-nav {
      position: fixed;
      top: 15px;
      left: 110px;
      right: 15px;
      height: 60px;
      z-index: 1000;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: var(--soft-shadow);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      justify-content: space-between;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body:has(#soft-sidebar:hover) #top-nav {
      left: 290px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-brand {
      font-weight: 700;
      font-size: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      border-radius: 10px;
      border: 1px solid #d2d6da;
      padding: 8px 12px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    .day-switcher {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d2d6da;
      border-radius: 10px;
      overflow: hidden;
    }
    .day-display {
      padding: 0 15px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      border-left: 1px solid #eee;
      border-right: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 90px;
      justify-content: center;
    }
    .nav-btn {
      border: none;
      background: transparent;
      padding: 8px;
      cursor: pointer;
      color: var(--primary);
      display: flex;
    }

    .variant-group {
      background: #f0f2f5;
      border-radius: 10px;
      padding: 3px;
      display: flex;
    }
    .variant-btn {
      border: none;
      padding: 6px 15px;
      cursor: pointer;
      font-weight: 600;
      background: transparent;
      color: #8392ab;
      font-size: 13px;
    }
    .variant-btn.active {
      background: #fff;
      color: var(--primary);
      border-radius: 7px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 13px;
      font-weight: 600;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    #kpi-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--glass);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: var(--soft-shadow);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 680px;
    }

    .kpi-item { text-align: center; min-width: 90px; }
    .kpi-label {
      font-size: 10px;
      color: #8392ab;
      text-transform: uppercase;
      font-weight: 700;
    }
    .kpi-value {
      font-size: 18px;
      color: var(--text-main);
      font-weight: 700;
    }

    #floating-panel {
      position: fixed;
      top: 90px;
      right: 15px;
      width: 330px;
      z-index: 1000;
      background: var(--glass);
      border-radius: 16px;
      box-shadow: var(--soft-shadow);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 16px;
      transition: width 0.25s ease, padding 0.25s ease;
      max-height: 65vh; /* 讓面板不會超過視窗 */
      overflow-y: auto; /* 啟用滾動條 */
    }

    #floating-panel.collapsed {
      width: 68px;
      padding: 12px 10px;
    }

    .float-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .float-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .float-title-text {
      white-space: nowrap;
    }

    .panel-toggle-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: #eef4ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #floating-panel.collapsed .float-content,
    #floating-panel.collapsed .float-title-text {
      display: none;
    }

    #floating-panel.collapsed .float-header {
      margin-bottom: 0;
      justify-content: center;
    }

    .float-block {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      max-height: 300px;
    }

    .mini-text {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
      display: none;
    }
    .notice.ok {
      display: block;
      background: #ecfdf5;
      color: #166534;
    }
    .notice.warn {
      display: block;
      background: #fff7ed;
      color: #9a3412;
    }
    .notice.err {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .action-btn.success { background: #16a34a; }
    .action-btn.gray { background: #64748b; }
    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 6px;
    }

    .switch {
      position: relative;
      width: 50px;
      height: 28px;
      display: inline-block;
    }

    .switch input { display: none; }

    .slider {
      position: absolute;
      inset: 0;
      background: #cbd5e1;
      border-radius: 999px;
      transition: 0.25s;
      cursor: pointer;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: white;
      transition: 0.25s;
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
    }

    .switch input:checked + .slider {
      background: var(--primary);
    }
    .switch input:checked + .slider:before {
      transform: translateX(22px);
    }

    .route-stop-icon div {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 800;
      color: #fff;
      user-select: none;
    }

    .depot-icon div {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
      font-size: 20px;
    }

    .all-point-icon div {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #94a3b8;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,.16);
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%) translateY(20px);
      z-index: 1400;
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1200px) {
      #floating-panel {
        width: 290px;
      }
      #floating-panel.collapsed {
        width: 68px;
      }
    }
  </style>
</head>
<body>

<aside id="soft-sidebar">
  <div class="sidebar-header">
    <div class="logo-box"><i data-lucide="layout-grid" size="18"></i></div>
    <span>Dispatch Nav</span>
  </div>
  <div class="menu-list">
    <a href="{% url 'home' %}" class="menu-item active">
      <div class="icon-box"><i data-lucide="home" size="18"></i></div>
      <span>主要地圖</span>
    </a>

    <a href="{% url 'live_monitor_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="map-pinned" size="18"></i></div>
      <span>即時監控</span>
    </a>

    <a href="{% url 'report_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="triangle-alert" size="18"></i></div>
      <span>問題回報</span>
    </a>

    <a href="{% url 'driver_admin_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="users-round" size="18"></i></div>
      <span>帳號管理</span>
    </a>

    <a href="{% url 'data_list' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="table" size="18"></i></div>
      <span>資料管理</span>
    </a>

    <a href="{% url 'cleaning_records_page' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="file-box" size="18"></i></div>
      <span>清掃紀錄</span>
    </a>

    <a href="{% url 'login' %}" class="menu-item">
      <div class="icon-box"><i data-lucide="log-out" size="14"></i></div>
      <span>登出</span>
    </a>
  </div>
</aside>

<nav id="top-nav">
  <div class="nav-left">
    <div class="nav-brand"><i data-lucide="truck"></i> Dispatch</div>
    <div class="controls">
      <select id="driverSel"><option>載入中...</option></select>

      <div class="day-switcher">
        <button type="button" class="nav-btn" id="prevDay"><i data-lucide="chevron-left"></i></button>
        <div class="day-display"><span id="currentDayText">第 1 天</span></div>
        <button type="button" class="nav-btn" id="nextDay"><i data-lucide="chevron-right"></i></button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="variant-group">
      <button type="button" class="variant-btn" data-variant="normal">不跨縣市</button>
      <button type="button" class="variant-btn" data-variant="compact">可跨縣市</button>
    </div>
    <div class="status-container">
      <div style="color:#17ad37">● 系統正常</div>
      <div id="liveTime">00:00:00</div>
    </div>
  </div>
</nav>

<div id="map"></div>

<div id="floating-panel">
  <div class="float-header">
    <div class="float-title">
      <i data-lucide="sliders-horizontal"></i>
      <span class="float-title-text">地圖操作</span>
    </div>
    <button type="button" class="panel-toggle-btn" id="panelToggleBtn" title="收合 / 展開">
      <i data-lucide="panel-right-close"></i>
    </button>
  </div>

  <div class="float-content">
    <div id="jsNotice" class="notice"></div>

    <div class="float-block">
      <div class="btn-row">
        <button id="btnRunScheduler" class="action-btn success" type="button">
          <i data-lucide="route"></i> 重新計算最佳路徑
        </button>
      </div>
      <div class="mini-text" style="margin-top:8px;">
        修改點位資料後，按這顆按鈕重新計算最新路線。
      </div>
    </div>

    <div class="float-block">
      <div class="toggle-row">
        <div>
          <div style="font-weight:800; color:#0f172a;">顯示全部點位</div>
          <div class="mini-text">開啟後會在地圖上加上所有點位，關閉只顯示本次清掃點位。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleAllPoints" />
          <span class="slider"></span>
        </label>
      </div>
      <div id="allPointsStatus" class="mini-text" style="margin-top:10px;">目前只顯示清掃點位。</div>
    </div>

    <div class="float-block">
      <div style="font-weight:800; color:#0f172a; margin-bottom:8px;">路線摘要</div>
      <div id="routeSummaryTitle" style="font-size:16px; font-weight:800; color:#0f172a; margin-bottom:8px;">尚未載入路線</div>
      <div id="routeMeta" class="mini-text">請先選擇類型、司機與天數。</div>
    </div>

    <div class="float-block">
      <div style="font-weight:800; color:#0f172a; margin-bottom:8px;">未排入點位</div>
      <div id="unassignedInfoText" class="mini-text">尚未載入未排入點位資訊。</div>
      <div class="btn-row" style="margin-top:10px;">
        <button id="btnDownloadUnassigned" class="action-btn gray" type="button" disabled>
          <i data-lucide="download"></i> 下載未排入點位檔案
        </button>
      </div>
    </div>
  </div>
</div>

<div id="kpi-panel">
  <div class="kpi-item"><div class="kpi-label">點位數</div><div id="kpiStops" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">服務(min)</div><div id="kpiService" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">車程(min)</div><div id="kpiDrive" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">總工時(min)</div><div id="kpiTotal" class="kpi-value">-</div></div>
  <div class="kpi-item"><div class="kpi-label">距離(km)</div><div id="kpiDist" class="kpi-value">-</div></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const INITIAL_VARIANT = "{{ initial_variant|escapejs }}";
const VARIANT_LABELS = {
  normal: "不跨縣市",
  cross: "可跨縣市",
  compact: "跨縣市精簡版"
};
const VARIANT_COLORS = {
  normal: "#2563eb",
  cross: "#ef4444",
  compact: "#8b5cf6"
};

const driverSelEl = document.getElementById("driverSel");
const currentDayTextEl = document.getElementById("currentDayText");
const prevDayEl = document.getElementById("prevDay");
const nextDayEl = document.getElementById("nextDay");
const btnRunSchedulerEl = document.getElementById("btnRunScheduler");
const toggleAllPointsEl = document.getElementById("toggleAllPoints");
const allPointsStatusEl = document.getElementById("allPointsStatus");
const noticeEl = document.getElementById("jsNotice");
const routeSummaryTitleEl = document.getElementById("routeSummaryTitle");
const routeMetaEl = document.getElementById("routeMeta");
const unassignedInfoTextEl = document.getElementById("unassignedInfoText");
const btnDownloadUnassignedEl = document.getElementById("btnDownloadUnassigned");
const panelToggleBtnEl = document.getElementById("panelToggleBtn");
const floatingPanelEl = document.getElementById("floating-panel");
const toastEl = document.getElementById("toast");

let toastTimer = null;

let map;
let routeLayer;
let stopLayer;
let depotLayer;
let allPointsLayer;

let state = {
  variant: INITIAL_VARIANT,
  options: null,
  route: null,
  currentDayIndex: 0,
  allPointsLoaded: false,
  allPoints: [],
  latestRunMeta: null,
};

function startLiveTime() {
  const timeEl = document.getElementById("liveTime");
  function update() {
    const now = new Date();
    const ampm = now.getHours() >= 12 ? "下午" : "上午";
    timeEl.textContent = `${ampm}${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
  }
  setInterval(update, 1000);
  update();
}

function showToast(message, duration=2200) {
  clearTimeout(toastTimer);
  toastEl.textContent = message;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
  }, duration);
}

function setNotice(message="", type="warn") {
  if (!message) {
    noticeEl.className = "notice";
    noticeEl.textContent = "";
    return;
  }
  noticeEl.className = `notice ${type}`;
  noticeEl.textContent = message;
}

function shouldSuppressMessage(message) {
  const text = String(message || "");
  return (
    (text.includes("routes_new.json") && text.includes("Dashboard grouped")) ||
    text.includes("跨縣市精簡版，由 phase2_scheduler_cross_county_compact.py 直接輸出。")
  );
}

function buildRunSummaryMessage(meta={}) {
  const total = Number(meta.total_db_points ?? 0);
  const unassigned = Number(meta.unassigned_db_points ?? 0);
  const scheduled = Number(meta.scheduled_db_points ?? Math.max(total - unassigned, 0));
  return `重排完成
已排入 ${scheduled} 個點位
未排入 ${unassigned} 個點位`;
}

function updateUnassignedUI(meta={}) {
  const total = Number(meta.total_db_points ?? 0);
  const unassigned = Number(meta.unassigned_db_points ?? 0);
  const scheduled = Number(meta.scheduled_db_points ?? Math.max(total - unassigned, 0));
  const nodeCount = Number(meta.unassigned_node_count ?? 0);
  const key = String(meta.unassigned_download_key || meta.download_key || "").trim();
  const filename = String(meta.unassigned_download_filename || meta.download_filename || "").trim();

  if (unassignedInfoTextEl) {
    if (total > 0 || scheduled > 0 || unassigned > 0) {
      if (unassigned > 0) {
        unassignedInfoTextEl.innerHTML = `目前資料共 <strong>${escapeHtml(total)}</strong> 個點位，已排入 <strong>${escapeHtml(scheduled)}</strong> 個，未排入 <strong>${escapeHtml(unassigned)}</strong> 個。<br>未排入節點數：<strong>${escapeHtml(nodeCount)}</strong>。`;
      } else {
        unassignedInfoTextEl.innerHTML = `目前資料共 <strong>${escapeHtml(total)}</strong> 個點位，已全部排入完成，沒有未排入點位。`;
      }
    } else {
      unassignedInfoTextEl.textContent = "尚未載入未排入點位資訊。";
    }
  }

  if (btnDownloadUnassignedEl) {
    btnDownloadUnassignedEl.dataset.exportKey = key;
    btnDownloadUnassignedEl.dataset.filename = filename;
    btnDownloadUnassignedEl.disabled = !(key && unassigned > 0);
  }
}

function initMap() {
  map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([25.02, 121.2], 10);
  L.tileLayer("https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", {
    maxZoom: 20,
    subdomains: ["mt0","mt1","mt2","mt3"]
  }).addTo(map);

  L.control.zoom({ position: "bottomright" }).addTo(map);

  routeLayer = L.layerGroup().addTo(map);
  stopLayer = L.layerGroup().addTo(map);
  depotLayer = L.layerGroup().addTo(map);
  allPointsLayer = L.layerGroup().addTo(map);
}

async function fetchJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}

function populateSelect(selectEl, items, selectedValue="") {
  selectEl.innerHTML = "";
  items.forEach(item => {
    const opt = document.createElement("option");
    opt.value = String(item.value);
    opt.textContent = item.label;
    if (String(item.value) === String(selectedValue)) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

function getCurrentDays() {
  const driver = driverSelEl.value;
  if (!state.options || !state.options.days_by_driver || !driver) return [];
  return state.options.days_by_driver[driver] || [];
}

function updateDayUI() {
  const days = getCurrentDays();
  if (!days.length) {
    currentDayTextEl.textContent = "無資料";
    clearMapAndSummary();
    return;
  }

  if (state.currentDayIndex < 0) state.currentDayIndex = 0;
  if (state.currentDayIndex > days.length - 1) state.currentDayIndex = days.length - 1;

  currentDayTextEl.textContent = `第 ${days[state.currentDayIndex]} 天`;
  renderRoute();
}

function fmtNum(value, digits=0) {
  const num = Number(value);
  if (!Number.isFinite(num)) return "-";
  return num.toFixed(digits);
}

function validPoint(item) {
  return Number.isFinite(Number(item?.lat)) && Number.isFinite(Number(item?.lon));
}

function makeDepotIcon() {
  return L.divIcon({
    className: "depot-icon",
    html: `<div>🏠</div>`,
    iconSize: [46, 46],
    iconAnchor: [23, 23]
  });
}

function makeStopIcon(seq, color) {
  return L.divIcon({
    className: "route-stop-icon",
    html: `
      <div style="
        width:42px;
        height:42px;
        background:${color};
        border:3px solid #ffffff;
        box-shadow:0 4px 14px rgba(0,0,0,.28);
        font-size:15px;
      ">${escapeHtml(seq)}</div>
    `,
    iconSize: [42, 42],
    iconAnchor: [21, 21]
  });
}

function makeAllPointIcon() {
  return L.divIcon({
    className: "all-point-icon",
    html: `<div></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
}

function escapeHtml(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function clearMainLayers() {
  routeLayer.clearLayers();
  stopLayer.clearLayers();
  depotLayer.clearLayers();
}

function clearAllPointLayers() {
  allPointsLayer.clearLayers();
}

function clearMapAndSummary() {
  clearMainLayers();
  clearAllPointLayers();
  document.getElementById("kpiStops").textContent = "-";
  document.getElementById("kpiService").textContent = "-";
  document.getElementById("kpiDrive").textContent = "-";
  document.getElementById("kpiTotal").textContent = "-";
  document.getElementById("kpiDist").textContent = "-";
  routeSummaryTitleEl.textContent = "尚未載入路線";
  routeMetaEl.textContent = "請先選擇類型、司機與天數。";
}

function drawMarkers(route, color) {
  if (validPoint(route.depot)) {
    L.marker([Number(route.depot.lat), Number(route.depot.lon)], {
      icon: makeDepotIcon()
    }).addTo(depotLayer).bindPopup(`
      <div>
        <div><strong>${escapeHtml(route.depot.name || "總部")}</strong></div>
        <div>模式：${escapeHtml(VARIANT_LABELS[state.variant] || state.variant)}</div>
      </div>
    `);
  }

  (route.stops || []).forEach(stop => {
    if (!validPoint(stop)) return;

    const marker = L.marker([Number(stop.lat), Number(stop.lon)], {
      icon: makeStopIcon(stop.seq, color)
    }).addTo(stopLayer);

    marker.bindPopup(`
      <div>
        <div><strong>#${escapeHtml(stop.seq)} ${escapeHtml(stop.task_id || "")}</strong></div>
        <div>地址：${escapeHtml(stop.address || "-")}</div>
        <div>服務時間：${escapeHtml(fmtNum(stop.service_min || 0, 0))} 分</div>
        <div>縣市：${escapeHtml(stop.county || "-")}</div>
      </div>
    `);
  });
}

function getDisplayCoords(route) {
  const coords = [];
  if (validPoint(route.depot)) {
    coords.push([Number(route.depot.lat), Number(route.depot.lon)]);
  }
  (route.stops || []).forEach(stop => {
    if (validPoint(stop)) {
      coords.push([Number(stop.lat), Number(stop.lon)]);
    }
  });
  return coords;
}

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function approxDistanceKm(coords) {
  let total = 0;
  for (let i = 1; i < coords.length; i += 1) {
    total += haversineKm(coords[i - 1], coords[i]);
  }
  return total;
}

async function drawRouteLine(route, color) {
  const coords = getDisplayCoords(route);

  if (coords.length < 2) {
    return {
      driveMin: route.metrics?.drive_min ?? null,
      distKm: route.metrics?.dist_km ?? null,
      source: "metrics"
    };
  }

  try {
    const coordStr = coords.map(([lat, lon]) => `${lon},${lat}`).join(";");
    const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.routes && json.routes[0]) {
      const routeGeo = json.routes[0];
      const latlngs = routeGeo.geometry.coordinates.map(([lon, lat]) => [lat, lon]);

      L.polyline(latlngs, { color: "#ffffff", weight: 10, opacity: 0.95, lineCap: "round" }).addTo(routeLayer);
      L.polyline(latlngs, { color, weight: 5, opacity: 0.96, lineCap: "round" }).addTo(routeLayer);

      return {
        driveMin: routeGeo.duration / 60,
        distKm: routeGeo.distance / 1000,
        source: "osrm"
      };
    }
  } catch (err) {
    console.warn("OSRM fallback to straight line:", err);
  }

  L.polyline(coords, { color: "#ffffff", weight: 10, opacity: 0.95, lineCap: "round" }).addTo(routeLayer);
  L.polyline(coords, { color, weight: 5, opacity: 0.96, lineCap: "round" }).addTo(routeLayer);

  return {
    driveMin: route.metrics?.drive_min ?? null,
    distKm: route.metrics?.dist_km ?? approxDistanceKm(coords),
    source: "straight"
  };
}

function updateSummary(route, visual) {
  const service = Number(route.metrics?.service_min ?? 0);
  const drive = Number(visual.driveMin ?? route.metrics?.drive_min ?? NaN);
  const dist = Number(visual.distKm ?? route.metrics?.dist_km ?? NaN);
  const total = Number.isFinite(drive) ? (service + drive) : Number(route.metrics?.total_min ?? service);

  document.getElementById("kpiStops").textContent = route.stop_count ?? route.stops.length ?? "-";
  document.getElementById("kpiService").textContent = Number.isFinite(service) ? fmtNum(service, 0) : "-";
  document.getElementById("kpiDrive").textContent = Number.isFinite(drive) ? fmtNum(drive, 0) : "-";
  document.getElementById("kpiTotal").textContent = Number.isFinite(total) ? fmtNum(total, 0) : "-";
  document.getElementById("kpiDist").textContent = Number.isFinite(dist) ? fmtNum(dist, 1) : "-";

  routeSummaryTitleEl.textContent = `${route.driver_label || route.driver}｜第 ${route.day} 天`;

  const counties = route.counties || [];
  routeMetaEl.innerHTML = `
    <div>司機代碼：<strong>${escapeHtml(route.driver)}</strong></div>
    <div>清掃點位：<strong>${escapeHtml(route.stop_count ?? route.stops.length)}</strong> 筆</div>
    <div>路線模式：<strong>${escapeHtml(VARIANT_LABELS[state.variant] || state.variant)}</strong></div>
    <div>縣市範圍：<strong>${escapeHtml(counties.length ? counties.join(" / ") : "-")}</strong></div>
    <div>道路來源：<strong>${escapeHtml(visual.source)}</strong></div>
  `;
}

function fitMapToRouteLayers() {
  const layers = [
    ...routeLayer.getLayers(),
    ...stopLayer.getLayers(),
    ...depotLayer.getLayers()
  ];
  const group = L.featureGroup(layers);
  try {
    if (group.getLayers().length > 0) {
      map.fitBounds(group.getBounds().pad(0.14));
    }
  } catch (err) {
    console.warn("fitBounds failed:", err);
  }
}

async function loadAllPoints() {
  if (state.allPointsLoaded) return;

  let page = 1;
  const pageSize = 200;
  let allItems = [];
  let totalPages = 1;

  while (page <= totalPages) {
    const data = await fetchJSON(`/api/points/page/?page=${page}&page_size=${pageSize}`);
    totalPages = data.total_pages || 1;
    allItems = allItems.concat(data.items || []);
    page += 1;
  }

  state.allPoints = allItems;
  state.allPointsLoaded = true;
}

function renderAllPointsLayer() {
  clearAllPointLayers();

  if (!toggleAllPointsEl.checked) {
    allPointsStatusEl.textContent = "目前只顯示清掃點位。";
    return;
  }

  const scheduledIds = new Set(
    (state.route?.stops || []).map(stop => String(stop.task_id ?? stop.id ?? ""))
  );

  (state.allPoints || []).forEach(item => {
    if (!validPoint(item)) return;
    if (scheduledIds.has(String(item.id))) return;

    const marker = L.marker([Number(item.lat), Number(item.lon)], {
      icon: makeAllPointIcon()
    }).addTo(allPointsLayer);

    marker.bindPopup(`
      <div>
        <div><strong>${escapeHtml(item.client_name || "-")}</strong></div>
        <div>ID：${escapeHtml(item.id)}</div>
        <div>地址：${escapeHtml(item.address || "-")}</div>
        <div>服務時間：${escapeHtml(item.service_time || "-")}</div>
      </div>
    `);
  });

  allPointsStatusEl.textContent = `已顯示全部點位，共載入 ${state.allPoints.length} 筆資料（清掃點位維持彩色高亮）。`;
}

async function renderRoute() {
  const days = getCurrentDays();
  const driver = driverSelEl.value;
  const day = days[state.currentDayIndex];

  if (!state.options || !driver || !day) {
    clearMapAndSummary();
    return;
  }

  try {
    const data = await fetchJSON(`/api/routes/detail/?variant=${state.variant}&driver=${encodeURIComponent(driver)}&day=${encodeURIComponent(day)}`);
    state.route = data.route;

    clearMainLayers();

    const color = VARIANT_COLORS[state.variant] || "#2563eb";
    drawMarkers(state.route, color);
    const visual = await drawRouteLine(state.route, color);
    updateSummary(state.route, visual);
    fitMapToRouteLayers();

    if (toggleAllPointsEl.checked) {
      await loadAllPoints();
      renderAllPointsLayer();
    } else {
      renderAllPointsLayer();
    }

    if (data.warning && !shouldSuppressMessage(data.warning)) {
      setNotice(data.warning, "warn");
    } else {
      setNotice("", "warn");
    }
  } catch (err) {
    clearMapAndSummary();
    setNotice(err.warning || err.message || "載入路線明細失敗。", "err");
  }
}

async function loadVariant(variant, preservedDriver=null, preservedDay=null) {
  state.variant = variant;
  document.querySelectorAll(".variant-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.variant === variant);
  });

  try {
    const data = await fetchJSON(`/api/routes/options/?variant=${variant}`);
    state.options = data;
    updateUnassignedUI(data.meta || {});

    const driverItems = data.drivers || [];
    let selectedDriver = driverItems[0]?.value ?? "";

    if (preservedDriver && driverItems.some(item => String(item.value) === String(preservedDriver))) {
      selectedDriver = preservedDriver;
    }

    populateSelect(driverSelEl, driverItems, selectedDriver);

    const days = data.days_by_driver?.[selectedDriver] || [];
    if (preservedDay && days.includes(preservedDay)) {
      state.currentDayIndex = days.indexOf(preservedDay);
    } else {
      state.currentDayIndex = 0;
    }

    updateDayUI();

    if (data.warning && !shouldSuppressMessage(data.warning)) {
      setNotice(data.warning, "warn");
    } else {
      setNotice("", "warn");
    }
  } catch (err) {
    clearMapAndSummary();
    setNotice(err.warning || err.message || "載入路線清單失敗。", "err");
  }
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchJsonSafe(url, options = {}) {
  const res = await fetch(url, options);
  const text = await res.text();

  let data = {};
  try {
    data = text ? JSON.parse(text) : {};
  } catch (err) {
    throw new Error(`伺服器沒有回傳 JSON（HTTP ${res.status}）。請檢查 Django 是否有報錯，或 trycloudflare 是否逾時。`);
  }

  if (!res.ok || data.ok === false) {
    throw new Error(data.message || `HTTP ${res.status}`);
  }

  return data;
}

async function pollSchedulerUntilFinished(preservedDriver, preservedDay) {
  const maxAttempts = 240;

  for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
    const status = await fetchJsonSafe(`/api/run/status/?variant=${encodeURIComponent(state.variant)}`, {
      method: "GET",
      credentials: "same-origin"
    });

    if (status.finished) {
      if (!status.success) {
        throw new Error(status.message || "排程執行失敗，請檢查 run_all_last.log");
      }

      state.latestRunMeta = status.run_meta || null;
      await loadVariant(state.variant, preservedDriver, preservedDay);

      if (state.latestRunMeta) {
        updateUnassignedUI(state.latestRunMeta);

        const summaryMessage = buildRunSummaryMessage(state.latestRunMeta);
        const unassignedCount = Number(state.latestRunMeta.unassigned_db_points || 0);
        const noticeType = unassignedCount > 0 ? "warn" : "ok";

        setNotice(summaryMessage.replace(/\n/g, "，"), noticeType);
        showToast(summaryMessage.replace(/\n/g, "，"), 3200);
        alert(summaryMessage);
      } else {
        setNotice("排程已重新執行完成。", "ok");
        showToast("排程已重新執行完成", 2500);
        alert("排程已重新執行完成。");
      }
      return;
    }

    setNotice(status.message || "正在重新計算最佳路徑，請稍候...", "warn");
    await delay(3000);
  }

  throw new Error(`等待排程完成逾時，請稍後重新整理頁面查看結果。若已在背景完成，重新整理後通常可看到新結果。`);
}

async function recalculateRoutes() {
  const preservedDriver = driverSelEl.value;
  const days = getCurrentDays();
  const preservedDay = days[state.currentDayIndex] ?? null;
  const originalBtnHtml = btnRunSchedulerEl.innerHTML;

  btnRunSchedulerEl.disabled = true;
  btnRunSchedulerEl.innerHTML = '<i data-lucide="loader-circle"></i> 背景排程中，請稍候...';
  lucide.createIcons();
  setNotice("正在重新計算最佳路徑，系統會在背景執行並自動更新畫面。", "warn");

  try {
    const startData = await fetchJsonSafe(`/run/?variant=${encodeURIComponent(state.variant)}&format=json`, {
      method: "GET",
      credentials: "same-origin"
    });

    showToast(startData.message || "已開始背景重新計算。", 2200);
    await pollSchedulerUntilFinished(preservedDriver, preservedDay);
  } catch (err) {
    setNotice(`重新計算失敗：${err.message || err}`, "err");
    alert(`重新計算失敗：${err.message || err}`);
  } finally {
    btnRunSchedulerEl.disabled = false;
    btnRunSchedulerEl.innerHTML = originalBtnHtml;
    lucide.createIcons();
  }
}
function bindEvents() {
  driverSelEl.addEventListener("change", () => {
    state.currentDayIndex = 0;
    updateDayUI();
  });

  prevDayEl.addEventListener("click", () => {
    const days = getCurrentDays();
    if (!days.length) return;
    if (state.currentDayIndex > 0) {
      state.currentDayIndex -= 1;
      updateDayUI();
    }
  });

  nextDayEl.addEventListener("click", () => {
    const days = getCurrentDays();
    if (!days.length) return;
    if (state.currentDayIndex < days.length - 1) {
      state.currentDayIndex += 1;
      updateDayUI();
    }
  });

  document.querySelectorAll(".variant-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      loadVariant(btn.dataset.variant);
    });
  });

  toggleAllPointsEl.addEventListener("change", async () => {
    if (toggleAllPointsEl.checked) {
      try {
        allPointsStatusEl.textContent = "正在載入全部點位...";
        await loadAllPoints();
        renderAllPointsLayer();
      } catch (err) {
        toggleAllPointsEl.checked = false;
        allPointsStatusEl.textContent = "全部點位載入失敗。";
        setNotice(err.warning || err.message || "全部點位載入失敗。", "err");
      }
    } else {
      renderAllPointsLayer();
    }
  });

  btnRunSchedulerEl.addEventListener("click", recalculateRoutes);

  btnDownloadUnassignedEl.addEventListener("click", () => {
    const exportKey = btnDownloadUnassignedEl.dataset.exportKey || "";
    if (!exportKey) {
      alert("目前沒有可下載的未排入點位檔案");
      return;
    }
    window.open(`/api/export/excel/?key=${encodeURIComponent(exportKey)}`, "_blank");
  });

  panelToggleBtnEl.addEventListener("click", () => {
    const collapsed = floatingPanelEl.classList.toggle("collapsed");
    panelToggleBtnEl.innerHTML = collapsed
      ? '<i data-lucide="panel-right-open"></i>'
      : '<i data-lucide="panel-right-close"></i>';
    lucide.createIcons();
  });
}

initMap();
bindEvents();
startLiveTime();
lucide.createIcons();
loadVariant(INITIAL_VARIANT);
</script>
</body>
</html>
