<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Nav | 智慧派工系統 - 登入</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #4A90E2;
      --primary-dark: #1a5ab5;
      --text-main: #344767;
      --soft-shadow: 0 20px 27px 0 rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: "Open Sans", sans-serif;
      /* --- 你的核心背景：由淺至深的藍色漸層 --- */
      background: linear-gradient(180deg, #e3f2fd 0%, #4A90E2 50%, #669ae2 100%);
      background-attachment: fixed;
    }

    /* 裝飾性的大圓形 (保留) */
    body::before {
      content: ""; position: absolute; top: -10%; right: -10%;
      width: 400px; height: 400px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); filter: blur(80px); z-index: 0;
    }

    /* --- 新增：頂部導航列樣式 --- */
    #top-nav {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 1100px; height: 60px;
      z-index: 1000; background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 50px; box-shadow: var(--soft-shadow);
      display: flex; align-items: center; padding: 0 30px;
      justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .nav-brand { font-weight: 700; color: var(--text-main); font-size: 16px; }
    .nav-menu { display: flex; gap: 25px; }
    .nav-link { 
      display: flex; align-items: center; gap: 6px; 
      color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 600;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--primary); }
    .btn-download {
      background: #344767; color: white; padding: 10px 22px;
      border-radius: 30px; font-size: 12px; font-weight: 700; text-decoration: none;
      text-transform: uppercase; transition: opacity 0.2s;
    }
    .btn-download:hover { opacity: 0.9; }

    /* --- 頁面內容容器 --- */
    .content-wrapper {
      height: 100%; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding-top: 80px; /* 避開導航列的高度 */
      position: relative; z-index: 1;
    }

    .login-card {
      /* 半透明毛玻璃效果 (保留) */
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px; border-radius: 24px;
      box-shadow: var(--soft-shadow);
      width: 100%; max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .card-header h2 { color: var(--text-main); font-size: 28px; font-weight: 700; margin: 0 0 10px; }
    .card-header p { color: #67748e; font-size: 15px; margin-bottom: 35px; }

    /* 讓提示文字靠左 */
    .form-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* 確保 label 靠左 */
    }

    .form-group label {
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
    font-size: 14px;
    }

    /* 核心：將圖示與格子水平排列 */
    .input-wrapper {
    display: flex;
    align-items: center; /* 垂直方向置中對齊 */
    width: 100%;
    gap: 15px; /* 圖示與格子之間的距離 */
    }

    /* 圖示樣式 */
    .input-wrapper i {
    color: #344767;
    flex-shrink: 0; /* 防止圖示被壓縮 */
    }

    /* 輸入框格子樣式 */
    input {
    flex: 1; /* 讓格子佔滿剩餘空間 */
    padding: 12px 15px;
    border: 1px solid #d2d6da;
    border-radius: 12px;
    font-size: 15px;
    background: rgba(255, 255, 255, 0.9);
    outline: none;
    transition: all 0.2s ease;
    }

    input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }
    .btn-login {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(310deg, #21d4fd 0%, #2178dd 100%);
      color: white; font-weight: 700; font-size: 16px;
      cursor: pointer; margin-top: 15px;
      box-shadow: 0 4px 15px rgba(33, 212, 253, 0.3);
      transition: 0.3s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(33, 212, 253, 0.4);
    }
    .btn-login:active { transform: translateY(0); }

    .footer-link { font-size: 14px; color: #67748e; margin-top: 25px; }
    .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <nav id="top-nav">
    <div class="nav-brand">軟UI儀表板</div>
    <div class="nav-menu">
      <a href="#" class="nav-link"><i data-lucide="layout-dashboard" size="16"></i> 儀表板</a>
      <a href="#" class="nav-link"><i data-lucide="user" size="16"></i> 輪廓</a>
     <a href="{% url 'register' %}" class="nav-link"><i data-lucide="user-plus" size="16"></i> 註冊</a>
      <a href="#" class="nav-link"><i data-lucide="key" size="16"></i> 登入</a>
    </div>
    <a href="#" class="btn-download">下載</a>
  </nav>

  <div class="content-wrapper">
    <div class="login-card">
      <div class="card-header">
        <h2>歡迎回來</h2>
        <p>請輸入您的管理員代號登入系統</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label>管理員帳號 ＭanagerID</label>
          <div class="input-wrapper">
            <i data-lucide="user" size="20"></i>
            <input type="text" id="userid" placeholder="請輸入管理員帳號" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>密碼 Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" size="20"></i>
            <input type="password" id="password" placeholder="請輸入密碼" required>
          </div>
        </div>
        
        <button type="submit" class="btn-login">Sing in</button>
      </form>
      
      <div class="footer-link">
        還沒有帳號？ <a href="{% url 'register' %}" class="text-info">聯絡管理員註冊</a>
      </div>
      
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  lucide.createIcons();

  document.getElementById('loginForm').onsubmit = async function(e) {
    e.preventDefault();
    
    const userid = document.getElementById('userid').value;
    const password = document.getElementById('password').value;

    // 發送資料給 views.py 中的 login_view
    const response = await fetch("{% url 'login' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}" // 必須包含這行，否則 Django 會擋掉
      },
      body: JSON.stringify({ userid: userid, password: password })
    });

    const result = await response.json();

    if (result.success) {
      // 驗證成功，跳轉到首頁 (home/)
      window.location.href = "{% url 'home' %}";
    } else {
      // 驗證失敗，彈出錯誤訊息
      alert(result.message);
    }
  };
</script>
</body>
</html>
