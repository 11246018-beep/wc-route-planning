<!DOCTYPE html>
<html>

<head>
    <title>每週清潔排程地圖 (Weekly Cleaning Schedule Map)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }

        #sidebar {
            width: 300px;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group h3 {
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        .filter-item {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .filter-item input {
            margin-right: 10px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            display: inline-block;
            margin-right: 5px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>排程篩選器 (Schedule Filter)</h2>
        <div class="filter-group">
            <h3>頻率 (Frequency)</h3>
            <div class="filter-item"><input type="checkbox" class="sheet-filter" value="週清1" checked> 週清1 (每週一次)</div>
            <div class="filter-item"><input type="checkbox" class="sheet-filter" value="週清2" checked> 週清2 (每週兩次)</div>
        </div>

        <div class="filter-group">
            <h3>星期 (Day of Week)</h3>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Mon" checked> 週一 (Mon)</div>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Tue" checked> 週二 (Tue)</div>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Wed" checked> 週三 (Wed)</div>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Thu" checked> 週四 (Thu)</div>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Fri" checked> 週五 (Fri)</div>
            <div class="filter-item"><input type="checkbox" class="day-filter" value="Sat" checked> 週六 (Sat)</div>
        </div>

        <div class="filter-group">
            <h3>司機 (Drivers)</h3>
            <div id="driver-filters"></div>
        </div>

        <button onclick="applyFilters()"
            style="padding: 10px; width: 100%; background: #007bff; color: white; border: none; cursor: pointer;">更新地圖
            (Update Map)</button>
    </div>

    <div id="map"></div>

    <script>
        // Data injected by python
        var scheduleData = {{ SCHEDULE_DATA }};

        var map = L.map('map').setView([24.95, 121.25], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var layerGroup = L.layerGroup().addTo(map);

        // Color Palette for 14 drivers
        var colors = [
            '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#00FFFF', '#FF00FF',
            '#800000', '#008000', '#000080', '#808000', '#008080', '#800080',
            '#FFA500', '#A52A2A'
        ];

        var driverColors = {};
        var allDrivers = new Set();

        scheduleData.forEach(d => allDrivers.add(d.Driver));
        Array.from(allDrivers).sort().forEach((d, i) => {
            driverColors[d] = colors[i % colors.length];
        });

        // Populate Driver Filters
        var driverContainer = document.getElementById('driver-filters');
        Array.from(allDrivers).sort().forEach(d => {
            var div = document.createElement('div');
            div.className = 'filter-item';
            div.innerHTML = `<input type="checkbox" class="driver-filter" value="${d}" checked> 
                         <span class="legend-color" style="background:${driverColors[d]}"></span>${d}`;
            driverContainer.appendChild(div);
        });

        function applyFilters() {
            layerGroup.clearLayers();

            var selectedSheets = Array.from(document.querySelectorAll('.sheet-filter:checked')).map(cb => cb.value);
            var selectedDays = Array.from(document.querySelectorAll('.day-filter:checked')).map(cb => cb.value);
            var selectedDrivers = Array.from(document.querySelectorAll('.driver-filter:checked')).map(cb => cb.value);

            scheduleData.forEach(entry => {
                if (!selectedSheets.includes(entry.Sheet)) return;
                if (!selectedDays.includes(entry.Day)) return;
                if (!selectedDrivers.includes(entry.Driver)) return;

                var color = driverColors[entry.Driver];

                // Add Route Geometry
                if (entry.Details.geometry) {
                    var latlngs = L.GeoJSON.coordsToLatLngs(entry.Details.geometry.coordinates);
                    L.polyline(latlngs, { color: color, weight: 3, opacity: 0.7 }).addTo(layerGroup)
                        .bindPopup(`<b>${entry.Driver}</b><br>${entry.Day} (${entry.Sheet})<br>距離: ${(entry.Details.distance_m / 1000).toFixed(1)}公里`);
                }

                // Add Task Markers
                if (entry.Details.tasks) {
                    entry.Details.tasks.forEach((task, idx) => {
                        L.circleMarker([task.lat, task.lon], {
                            radius: 5,
                            fillColor: color,
                            color: '#000',
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(layerGroup)
                            .bindPopup(`<b>${idx + 1}. ${task.name || '客戶'}</b><br>${task.address}<br>時間: ${task.clean_time}分鐘`);
                    });
                }
            });
        }

        // Initial render
        applyFilters();

    </script>

</body>

</html>
